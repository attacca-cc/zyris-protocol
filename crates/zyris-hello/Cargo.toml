[package]
name = "zyris-hello"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference Zyris node: one capability, one tool, and a main that says nothing else"
publish = false

[[bin]]
name = "zyris-hello"
path = "src/main.rs"

[dependencies]
rand = "0.9"
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
# This node stores its own account credential, because the library does not: it hands one back
# as a value and takes one back as one.
serde_json.workspace = true
# `signal` is this program's, not the library's: when a node stops is a decision nothing under
# `zyris::` makes any more.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# The protocol, the declarations and the `attacca_api` client, all through the face.
zyris = { version = "0.2.0", path = "../zyris", features = ["caps", "enroll"] }
# Named directly rather than reached through the face. `attacca_api` is one deployment's hub, so
# the protocol's face does not carry it — every consumer that talks to Attacca lists it here.
zyris-attacca = { version = "0.2.0", path = "../zyris-attacca" }
# The reference implementations, named directly. They are not part of the published face: what a
# node offers is the node's decision, so `PtyTerminal` here is an example of the choice, not the
# protocol making it. Copying this crate means copying this line and then replacing it.
zyris-capkit = { version = "0.2.0", path = "../zyris-capkit" }
anyhow = { version = "1", optional = true }
# For the `PeerConfirmer` impl below — the trait is `#[async_trait]`, so an implementor needs it too.
async-trait = { workspace = true, optional = true }

[features]
# Off by default so `cargo build --workspace` needs no X11/Wayland development packages. Turn it on
# for a node that sits at a desk with a screen and a keyboard someone wants driven:
#     cargo run -p zyris-hello --features desktop
# On Linux that build needs the libraries in this repo's `flake.nix`; `nix develop` provides them.
desktop = ["zyris-capkit/desktop", "zyris-capkit/input-wayland"]
# Node-to-node file transfer: announces `file_transfer`, publishes this node's peer endpoint so
# others can look it up, and accepts incoming peer connections. Off by default because it binds a
# UDP socket and writes to disk — a node should opt into both.
#     cargo run -p zyris-hello --features transfer
transfer = [
    "zyris-capkit/transfer-send",
    "zyris-capkit/transfer-listen",
    # The rendezvous is how a peer learns whose node it is talking to, and this crate names both
    # of those modules itself, so it asks the face for them rather than relying on capkit's
    # private copies.
    "zyris/p2p",
    "dep:anyhow",
    "dep:async-trait",
]
