[package]
name = "zyris-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The reference terminal implementation for Zyris: PTYs over portable-pty"
readme = "README.md"
keywords = ["zyris", "terminal", "pty", "shell", "capability"]
categories = ["network-programming", "os", "api-bindings"]

# One implementation, one type, no features: everything here is pure Rust and builds on any
# platform the runtime does, so gating it would only give a caller a way to depend on this crate
# and get nothing.
[dependencies]
bytes.workspace = true
futures-util.workspace = true
portable-pty = "0.9.0"
tokio = { workspace = true, features = ["io-util", "process", "time", "rt"] }
# The screen model. `vte` is a parser with no screen behind it, and `termwiz` / `alacritty_terminal`
# are far more than this needs.
vt100 = "0.16.2"
zyris = { version = "0.2.0", package = "zyris-core", path = "../zyris-core", default-features = false }
zyris-caps = { version = "0.2.0", path = "../zyris-caps" }

# Process-group kill (`kill(-pgid, SIGKILL)`) for `exec` timeouts, which is the only line of this
# crate that names libc. Windows kills the tree with `taskkill /T` instead, so declaring the
# dependency unconditionally would make every Windows build carry a crate nothing there compiles.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
bytes.workspace = true
futures-util.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# `zyris::testing::duplex` — two real Connections over a channel. Every test here drives a client
# and this implementation through it, so none of them needs a socket. It is a non-default feature,
# and without this line the tests do not compile at all.
zyris = { version = "0.2.0", package = "zyris-core", path = "../zyris-core", default-features = false, features = ["testing"] }
