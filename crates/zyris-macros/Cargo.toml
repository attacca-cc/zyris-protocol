[package]
name = "zyris-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Proc-macros for the Zyris protocol"
readme = "README.md"
keywords = ["zyris", "protocol", "macro", "capability", "codegen"]
categories = ["development-tools::procedural-macro-helpers", "network-programming"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.3", features = ["full"] }

[dev-dependencies]
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
trybuild = "1.0.118"
zyris = { package = "zyris-core", path = "../zyris-core", default-features = false }

[package.metadata.docs.rs]
all-features = true
