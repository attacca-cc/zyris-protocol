[package]
name = "zyris-caps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The standard Zyris capability declarations"
readme = "README.md"
keywords = ["zyris", "protocol", "capabilities", "tools", "schema"]
categories = ["network-programming", "api-bindings"]

# Declarations only: no tokio, no OS deps, nothing a client would have to pay for. `async_trait` is
# not listed because the macro reaches it through `::zyris::`; `serde_json` is, because
# `browser_chrome` speaks `serde_json::Value` on the wire.
[dependencies]
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
zyris ={ version = "0.2.0", package = "zyris-core", path = "../zyris-core", default-features = false }

[package.metadata.docs.rs]
all-features = true
