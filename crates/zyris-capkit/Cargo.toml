[package]
name = "zyris-capkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference implementations of the standard Zyris capabilities, one feature each"
readme = "README.md"
keywords = ["zyris", "capabilities", "terminal", "screenshot", "automation"]
categories = ["network-programming", "os", "api-bindings"]
# Held back by one dependency: `input` pins a git fork of `enigo`, and crates.io refuses a manifest
# that names a git source even when the dependency is optional. Worse, `cargo package` does not
# refuse it — it silently drops the `git` and `rev` and resolves upstream `enigo` from crates.io,
# which lacks both patches (see RELEASING.md). Lift this once the fork is published under a name of
# its own and the `enigo` line below points at it.
publish = false

[dependencies]
# Always on: every module is an implementation of a `zyris-caps` declaration, served through
# `zyris-core`. The rest of this block is what `zyris-core` already pulls in, so naming it
# unconditionally costs nothing.
bytes.workspace = true
futures-util.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
# The union of what the modules ask for. None of these is a runtime feature — the runtime is the
# node program's to choose. `rt` is `spawn_blocking` and `spawn`; `process` and `time` are the
# terminal's `exec` and settle loop; `fs`/`io-util`/`sync` are file I/O and transfer.
tokio = { workspace = true, features = ["fs", "io-util", "sync", "rt", "process", "time"] }
zyris = { version = "0.2.0", package = "zyris-core", path = "../zyris-core", default-features = false }
zyris-caps = { version = "0.2.0", path = "../zyris-caps" }

# --- terminal ---
portable-pty = { version = "0.9.0", optional = true }
# The screen model. `vte` is a parser with no screen behind it, and `termwiz` / `alacritty_terminal`
# are far more than this needs.
vt100 = { version = "0.16.2", optional = true }

# --- screen ---
# Cropping, downscaling and the two encoders. Only the formats `ImageFormat` can name are built.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
xcap = { version = "0.9.7", optional = true }

# --- input ---
# Our enigo fork. It carries two things upstream does not: `Enigo::move_mouse_on_output`, because
# absolute motion under `wlr-virtual-pointer` is output-relative and upstream's whole-desktop
# `move_mouse` can only ever land on the output its pointer was created against (see
# `EnigoInput::move_to`); and Shift for level-1 keysyms on libei, without which `!` arrives as `1`
# under GNOME.
#
# **Fixes belong in that repository, not in a `[patch]` here or downstream.** A local path patch
# builds on exactly one machine, and the Shift fix sat uncommitted in one for a while.
#
# Pinned by rev for the same reason the three zyris consumers pin zyris: a floating default branch
# means the desktop feature can change under a build nobody touched.
enigo = { version = "0.6.1", git = "https://github.com/ridanit-ruma/enigo-zyris", rev = "98edfe35f3400f5e4c92df58840da2e7dfc9d879", default-features = false, features = ["x11rb"], optional = true }

# --- transfer ---
# `transfer_id` and the `.part` marker are hex, and so is every sha256 that crosses the wire.
hex = { version = "0.4", optional = true }
# Held at 0.10 rather than the workspace's 0.11: the digest here has to keep producing byte-for-byte
# the same `transfer_id` and the same `sha256` string an already-deployed peer will check against,
# and a resume that stopped matching would restart silently rather than fail.
sha2 = { version = "0.10", optional = true }
# Both halves of the network ask the rendezvous where a peer is, or whose a peer is.
zyris-attacca = { version = "0.2.0", path = "../zyris-attacca", optional = true }
# The transport. `iroh` is never named directly in this crate's own source — `zyris-p2p` re-exports
# the one it resolved, so there is no way for a second copy to end up linked in.
zyris-p2p = { version = "0.2.0", path = "../zyris-p2p", optional = true }

# `xcap` enumerates monitors over XRandR even in a Wayland session, then captures in Wayland's
# coordinate space; the two disagree whenever Xwayland cannot express the compositor's layout. The
# Wayland backend goes straight to `wl_output`. This is the fork `xcap` itself depends on, so it
# costs no extra copy of the Wayland stack.
[target.'cfg(target_os = "linux")'.dependencies]
libwayshot = { package = "libwayshot-xcap", version = "0.3.3", optional = true }

# Process-group kill for the terminal's `exec` timeouts, and `O_NOFOLLOW` on transfer's `.part`
# files. Windows has neither, so declaring this unconditionally would make every Windows build carry
# a crate nothing there compiles.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["file-io", "terminal"]
file-io = []
terminal = ["dep:portable-pty", "dep:vt100"]
# `screen` links the display stack and needs development packages on Linux; see docs/screen.md.
screen = ["dep:image", "dep:xcap", "dep:libwayshot"]
input = ["dep:enigo"]
# The `wlr-virtual-keyboard` / `wlr-virtual-pointer` path, which only a wlroots-based compositor
# exposes. `platform_specific` is what exposes the fork's `move_mouse_on_output` at all.
input-wayland = ["input", "enigo/wayland", "enigo/platform_specific"]
# The libei (RemoteDesktop portal) backend: mutter ignores XTEST on GNOME/KDE Wayland, so this is
# the only input path that works on those sessions.
input-libei = ["input", "enigo/libei", "enigo/smol", "enigo/platform_specific"]
desktop = ["screen", "input"]
transfer = ["dep:hex", "dep:sha2"]
# The sending side: `file_transfer.send_to`.
transfer-send = ["transfer", "dep:zyris-attacca", "dep:zyris-p2p"]
# The receiving side of the network: accepting peer connections needs the rendezvous (to know whose
# nodes they are) and iroh (to accept at all).
transfer-listen = ["transfer", "dep:zyris-attacca", "dep:zyris-p2p"]

[dev-dependencies]
hex = "0.4"
iroh = { version = "1", features = ["test-utils"] }
sha2 = "0.10"
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# `zyris::testing::duplex` — two real Connections over a channel, without a socket.
zyris = { version = "0.2.0", package = "zyris-core", path = "../zyris-core", default-features = false, features = ["testing"] }

[[test]]
name = "file_io"
required-features = ["file-io"]

[[test]]
name = "terminal"
required-features = ["terminal"]

[[test]]
name = "poll"
required-features = ["terminal"]

[[test]]
name = "terminal_windows"
required-features = ["terminal"]

[[test]]
name = "screen"
required-features = ["screen"]

[[test]]
name = "inbox_jail"
required-features = ["transfer"]

[[test]]
name = "undo"
required-features = ["transfer"]

[[test]]
name = "peer_transfer"
required-features = ["transfer"]

[[test]]
name = "send_to"
required-features = ["transfer-send"]

[[test]]
name = "serve_peers"
required-features = ["transfer-listen"]
