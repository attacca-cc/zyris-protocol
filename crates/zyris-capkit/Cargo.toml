[package]
name = "zyris-capkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference implementations of the standard Zyris capabilities"
readme = "README.md"
keywords = ["zyris", "capabilities", "terminal", "screenshot", "automation"]
categories = ["network-programming", "os", "api-bindings"]
# Reference implementations are the program's responsibility, not the protocol's: a library
# consumer needs the declarations (`zyris-caps`) to speak the protocol and writes its own
# implementations of the parts it actually offers. Keeping this crate unpublished also keeps the
# `enigo` git fork below off crates.io, which a published crate may not depend on at all. It stays
# a workspace member and the three consumers keep depending on it by git.
publish = false

[dependencies]
# Always: `path`/`resolve_under`/`Displays` are re-exported from here unconditionally, and this is
# the only dependency that is not one of the crates this facade stands in front of.
zyris-caps = { version = "0.2.0", path = "../zyris-caps" }

zyris-fs = { version = "0.2.0", path = "../zyris-fs", optional = true }
zyris-input = { version = "0.2.0", path = "../zyris-input", optional = true }
zyris-screen = { version = "0.2.0", path = "../zyris-screen", optional = true }
zyris-terminal = { version = "0.2.0", path = "../zyris-terminal", optional = true }
zyris-transfer = { version = "0.2.0", path = "../zyris-transfer", optional = true }

# The old feature names, each now nothing but "pull in the crate that holds it". Kept identical so
# a consumer moves in one commit — change the dependency line, change the import, done — rather
# than having to get the feature spelling right in the same breath. `desktop` survives only here,
# and only because this crate is unpublishable anyway, so it sinks nothing.
[features]
default = ["file-io", "terminal"]
file-io = ["dep:zyris-fs"]
terminal = ["dep:zyris-terminal"]
screen = ["dep:zyris-screen"]
input = ["dep:zyris-input"]
input-wayland = ["input", "zyris-input/wayland"]
input-libei = ["input", "zyris-input/libei"]
desktop = ["screen", "input"]
transfer = ["dep:zyris-transfer"]
transfer-send = ["transfer", "zyris-transfer/send"]
transfer-listen = ["transfer", "zyris-transfer/listen"]
