[package]
name = "zyris-input"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The reference input implementation for Zyris: keyboard and pointer via enigo"
readme = "README.md"
keywords = ["zyris", "input", "keyboard", "mouse", "automation"]
categories = ["network-programming", "os", "api-bindings"]
# **This is the one implementation crate that cannot be published, and the `enigo` dependency below
# is the whole reason.** Splitting the reference implementations out of `zyris-capkit` was about
# confining that: `zyris-fs`, `zyris-terminal`, `zyris-transfer` and `zyris-screen` are publishable
# now, and only this one waits. The way out is upstreaming the fork's two patches, not a `[patch]`
# anywhere — see the comment on the dependency.
#
# **`publish = false` is what stops it, and the reason matters more than it looks.** An earlier
# version of this comment said crates.io refuses any manifest naming a git source. It does not, for
# the form used below: a dependency carrying *both* `version` and `git` packages happily, and cargo
# **silently drops the `git` and `rev`**. Measured with a throwaway crate carrying this exact line —
# `cargo package --no-verify` succeeded and the packaged manifest read:
#
#     [dependencies.enigo]
#     version = "0.6.1"
#     features = ["x11rb"]
#
# Upstream `enigo`, not the fork, with nothing said. What catches it in practice is the verification
# build `--no-verify` skips, and what catches it reliably is the line below.
publish = false

[dependencies]
# Our enigo fork. It carries two things upstream does not: `Enigo::move_mouse_on_output`, because
# absolute motion under `wlr-virtual-pointer` is output-relative and upstream's whole-desktop
# `move_mouse` can only ever land on the output its pointer was created against (see
# `EnigoInput::move_to`); and Shift for level-1 keysyms on libei, without which `!` arrives as `1`
# under GNOME.
#
# **Fixes belong in that repository, not in a `[patch]` here or downstream.** A local path patch
# builds on exactly one machine, and the Shift fix sat uncommitted in one for a while.
#
# Pinned by rev for the same reason the three zyris consumers pin zyris: a floating default branch
# means the desktop feature can change under a build nobody touched.
enigo = { version = "0.6.1", git = "https://github.com/ridanit-ruma/enigo-zyris", rev = "98edfe35f3400f5e4c92df58840da2e7dfc9d879", default-features = false, features = ["x11rb"] }
# `spawn_blocking`, and nothing else. `Enigo` owns a connection to the display server and none of
# its methods are async, so every call hops to a blocking thread. No runtime feature — the runtime
# is the node program's to choose.
tokio = { workspace = true, features = ["rt"] }
zyris = { version = "0.2.0", package = "zyris-core", path = "../zyris-core", default-features = false }
zyris-caps = { version = "0.2.0", path = "../zyris-caps" }

# Both are off by default and both are Linux-only in effect: the reis/ashpd and wayland-client
# dependencies they reach are declared unix-only on the enigo side, so a Windows or macOS build
# turning them on gets the same `SendInput`/`CGEvent` backend it had.
[features]
default = []
# The `wlr-virtual-keyboard` / `wlr-virtual-pointer` path, which only a wlroots-based compositor
# exposes. It is also what makes `EnigoInput::move_to` able to address a second monitor there:
# without it there is no per-output pointer to bind, and `platform_specific` is what exposes the
# fork's `move_mouse_on_output` at all.
wayland = ["enigo/wayland", "enigo/platform_specific"]
# The libei (RemoteDesktop portal) backend: mutter ignores XTEST on GNOME/KDE Wayland, so this is
# the only input path that works on those sessions.
libei = ["enigo/libei", "enigo/smol", "enigo/platform_specific"]

# No `[package.metadata.docs.rs]`: `publish = false` above means docs.rs never builds this crate.
