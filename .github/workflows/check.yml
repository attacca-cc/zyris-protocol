name: Check

on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Caches ~/.cargo/{registry,git} and target/, keyed on Cargo.lock + rustc version. Workspace
      # crates' own artifacts are pruned before saving, so the archive stays dependency-only.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          cache-on-failure: true

      # `zyris-screen` and `zyris-input` are workspace members now, so `--workspace` compiles the
      # display stack here for the first time. `xcap` reaches X11 and the portal, `libwayshot`
      # reaches Wayland, and `enigo` links `xkbcommon` with a bare `#[link]` and no pkg-config
      # probe of its own. Before the split these crates were a capkit feature nothing turned on,
      # which is a polite way of saying nothing had ever compiled them.
      #
      # **`cargo build` does not prove this list is complete.** A library target stops at an rlib,
      # which records the `-l` flags rather than resolving them; only an executable calls the
      # linker. So the build step below went green with `libgbm-dev` missing and the test step
      # failed on `unable to find library -lgbm` — from `libwayshot`, three crates down. Add a
      # package here when a *test* fails to link, and do not read a green build as agreement.
      - name: display development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev \
            libxkbcommon-dev

      - name: cargo build
        run: cargo build --workspace

      # **The other TLS provider, which nothing else compiles.** `--workspace` builds every member
      # with its default features and no provider is one of them; the test step below turns on
      # `zyris/enroll`, and `enroll = ["dep:reqwest", "tls-ring"]` — so `tls-ring` is reached and
      # `tls-aws-lc` is not, by any invocation in this file. That matters because
      # `zyris-core/src/tls.rs` has a *separate* `install_chosen_provider` body behind that cfg, and
      # because `zyris-core`'s docs.rs metadata is `all-features = true` — so the first machine ever
      # to compile it would have been the doc builder, where a failure is a permanently red page on
      # the crate everyone reads. One build, and it stays compiled.
      - name: cargo build (the aws-lc provider)
        run: cargo build -p zyris-core --no-default-features --features client,tls-aws-lc

      # Includes zyris-macros' trybuild UI tests, which compare compiler diagnostics against
      # checked-in .stderr files — they are the reason a toolchain bump can fail this job on its own.
      #
      # **The feature flags are load-bearing, not a nicety.** `--workspace` builds every member with
      # its *default* features, and nothing turns `zyris-transfer`'s `send`/`listen` on — so a plain
      # `cargo test --workspace` compiles all five of the file-transfer test files down to nothing
      # and reports `0 tests` for each. That was the state of this job until 2026-08-11: green over a
      # path jail, an undo trail and a TOFU pin that nothing had ever executed. Naming the features
      # here is what makes those tests real.
      #
      # They read `zyris-transfer/...` rather than `zyris-capkit/...` since the split. A `--features`
      # flag naming a crate that is not in the workspace is an error, so that rename cannot rot
      # silently — but a *test target* that no longer exists is skipped, not failed, which is why
      # the Windows job below moved in the same commit.
      #
      # Every feature that gates tests has to be named. `zyris-screen`'s six tests are the one
      # exception and they are now compiled and run here: each asks `ScreenBackend::detect()` for a
      # display first and returns early when there is none, so on a headless runner they pass by
      # doing nothing. That is weaker than it sounds and is on purpose — compiling them is what
      # catches a backend that stopped building, which is the failure this job can actually see.
      - name: cargo test
        # `zyris/enroll` is here so the `facade_probe` example is compiled: it declares
        # `required-features = ["enroll"]`, and a target whose features are not enabled is
        # skipped silently rather than failing — which would make it a guard that guards nothing.
        run: cargo test --workspace --features zyris-transfer/send,zyris-transfer/listen,zyris/enroll

      # **The providerless build, which no other step above runs a single test of.** Everything
      # before this either builds without running (`cargo build`) or unions `zyris/enroll` — and
      # `enroll = ["dep:reqwest", "tls-ring"]` — into `zyris-core`, so `tls-ring` is on and the
      # `not(any(tls-ring, tls-aws-lc))` half of `tests/tls_provider.rs` compiles to nothing. That
      # half is where `ConnectError::NoTlsProvider` is asserted at all: that a build with no
      # provider refuses by name rather than panicking inside rustls, and that it decides so before
      # opening a socket. `-p zyris-core` takes this crate's own defaults, and its dev-dependency
      # `zyris` asks for `client` and `hostname` and no provider, which is exactly the cfg those
      # tests need. Without this line they are three tests nothing has ever executed.
      - name: cargo test (no TLS provider)
        run: cargo test -p zyris-core

      # Each transfer feature alone. `--workspace` above unions them, which is exactly the shape
      # that hid `listen` not compiling without `send`: `transfer/listen.rs` reached
      # `super::send::Rendezvous`, so the manifest's claim that the two are independent was false
      # and no build in this repository ever tested it. One line per feature, so the failure names
      # which one.
      - name: cargo build (each transfer feature alone)
        run: |
          cargo build -p zyris-transfer
          cargo build -p zyris-transfer --features send
          cargo build -p zyris-transfer --features listen

  # Windows is a platform this repo makes claims about and has never run. `Terminal::exec`'s doc
  # tells an agent how to run a PowerShell script without fighting quoting — that sentence *is* the
  # tool description a model reads — and nothing has ever executed it. Agents reaching for
  # `-EncodedCommand` instead is the symptom that says the advice might not work.
  #
  # Deliberately not `cargo test --workspace`: most of this suite is Unix-shaped (`/bin/sh`, `stty`,
  # symlinks, `libc`), and a job that fails for those reasons teaches nothing and gets ignored. This
  # runs the build, which catches the compile breakage a Linux-only CI cannot see, and the tests
  # that are about Windows specifically.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          cache-on-failure: true

      # The whole workspace, so a Windows-only compile error surfaces here rather than in whatever
      # a user is trying to do at the time.
      - name: cargo build
        run: cargo build --workspace

      - name: cargo test (windows-specific)
        run: cargo test -p zyris-terminal --test terminal_windows
